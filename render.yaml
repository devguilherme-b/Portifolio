services:
  - type: web
    name: portifolio
    runtime: dotnet
    repo: https://github.com/devguilherme-b/Portifolio
    branch: main
    buildCommand: dotnet publish -c Release -o out
    startCommand: dotnet out/DevPortifolio.dll
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production

